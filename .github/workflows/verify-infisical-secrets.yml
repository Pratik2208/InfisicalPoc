name: verify-infisical-secrets

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  check-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Step 1: pull secrets from Infisical Cloud into env vars for this job ---
      # Requires two GitHub Actions secrets to be set on this repo:
      #   INFISICAL_CLIENT_ID     -> your machine identity's Client ID
      #   INFISICAL_CLIENT_SECRET -> your machine identity's Client Secret
      # Update project-slug / env-slug below to match your Infisical project.
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "universal-auth"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: "https://app.infisical.com"
          env-slug: "dev"                     # <-- change to your environment slug
          project-slug: "example-project-cvqi"   # <-- change to your Infisical project slug

      # --- Step 2: build the dotnet API ---
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/InfisicalPoc.Api/InfisicalPoc.Api.csproj

      - name: Build
        run: dotnet build src/InfisicalPoc.Api/InfisicalPoc.Api.csproj --no-restore --configuration Release

      # --- Step 3: run the API in the background using the injected env vars ---
      - name: Run API in background
        run: |
          nohup dotnet run \
            --project src/InfisicalPoc.Api/InfisicalPoc.Api.csproj \
            --no-build --configuration Release \
            --urls http://localhost:5080 \
            > api.log 2>&1 &
          echo "Waiting for API to start..."
          for i in {1..15}; do
            if curl -s http://localhost:5080/ > /dev/null; then
              echo "API is up."
              break
            fi
            sleep 1
          done

      # --- Step 4: hit the secret-check endpoint and fail the job if the secret isn't reachable ---
      - name: Verify secret is reachable through the running API
        run: |
          response=$(curl -s http://localhost:5080/api/secret-check)
          echo "Response: $response"
          if echo "$response" | grep -q '"found":true'; then
            echo "✅ Secret was reachable through the running .NET API."
          else
            echo "❌ Secret was NOT reachable."
            cat api.log
            exit 1
          fi

      - name: Print API logs (for debugging)
        if: always()
        run: cat api.log || true
